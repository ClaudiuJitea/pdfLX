name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgirepository1.0-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libadwaita-1-dev \
            libgtk-4-dev \
            libfuse2 \
            python3 \
            python3-venv \
            python3-pip \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            dpkg-dev

      - name: Build AppImage
        run: |
          chmod +x build-appimage.sh
          ./build-appimage.sh

      # The .deb is architecture-independent (dependencies install at setup time), so one is enough.
      - name: Build Debian package
        if: matrix.arch == 'x86_64'
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh
          # Offline packages bundle the Python libraries for both CPUs (wheels are cross-downloaded).
          ./build-deb.sh --offline --arch amd64
          ./build-deb.sh --offline --arch arm64
          mv dist/*.deb .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.arch }}
          path: |
            pdflx-*.AppImage
            pdflx_*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Check out first: checkout cleans the workspace and would remove downloaded assets.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "### Which file?"
            echo
            echo "| File | For |"
            echo "|---|---|"
            echo "| \`pdflx-x86_64.AppImage\` / \`pdflx-aarch64.AppImage\` | Any Linux distribution, nothing to install: \`chmod +x\` and run. |"
            echo "| \`pdflx_${version}_all.deb\` | Ubuntu 24.04+ / Debian 13+, small download; Python libraries are downloaded during installation. |"
            echo "| \`pdflx_${version}_offline_amd64.deb\` / \`pdflx_${version}_offline_arm64.deb\` | Ubuntu 24.04+ / Debian 13+ without internet access: all Python libraries are included. |"
            echo
            echo "Install a \`.deb\` with \`sudo apt install ./<file>.deb\`."
            echo
            echo "### What's new"
            echo
            awk -v v="$version" '$0 ~ "^## "v" " {found=1; next} found && /^## / {exit} found' CHANGELOG.md
          } > release-notes.md
          echo "=== Release notes ===" && cat release-notes.md
          echo "=== Release assets ===" && ls -lh release-assets/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: pdfLX ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*.AppImage
            release-assets/*.deb
          draft: false
          prerelease: false
